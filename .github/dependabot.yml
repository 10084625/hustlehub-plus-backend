# Keeps dependencies patched automatically (Part 3, DevSecOps).
# Dependabot opens a pull request when a newer or patched version exists;
# the CI pipeline then tests it before anyone merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /client
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
