# Forward to the API container over HTTPS. The API's certificate is verified
# (it lists "api" as a name), so traffic between the two containers is
# encrypted AND authenticated. The API sends its own security headers.
proxy_pass https://api:5000;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/nginx/certs/cert.pem;
proxy_ssl_name api;
proxy_ssl_server_name on;
proxy_set_header Host $host;
# Overwrite (do not append) so a client cannot spoof its IP address and
# dodge the API's per-IP rate limits.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 30s;
