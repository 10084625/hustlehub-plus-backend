# nginx for the HustleHub+ React app (Part 3, Docker).
# Serves the built app over HTTPS with strict security headers and CSP, and
# proxies /api to the API container so the browser only ever talks to one
# origin (which is why the CSP can say connect-src 'self').

server_tokens off;

# Extra layer in front of the API's own limits: at most 5 sign-in requests
# per second per client IP, with a small burst allowance.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Docker health check, on a local-only port that is never published
server {
    listen 127.0.0.1:8081;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Built files have content hashes in their names, so they can be cached.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html (React Router handles them)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
