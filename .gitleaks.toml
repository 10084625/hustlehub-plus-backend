# Gitleaks configuration (Part 3, secret scanning in CI).
# Uses all of Gitleaks' built-in rules. Saved test reports are excluded:
# they are generated by test runs against a local throwaway database and
# can contain short-lived test tokens. Real secrets live only in .env files,
# which are never committed (.gitignore).
title = "HustleHub+ gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated test evidence"
paths = [
  '''docs/evidence/''',
]
